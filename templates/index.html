<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Emotion Detector</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>
  <h1>Emotion Detector</h1>
  <textarea id="textToAnalyze" rows="4" cols="60" placeholder="Enter text"></textarea><br>
  <button onclick="runEmotionDetector()">Run Sentiment Analysis</button>
  <div id="system_response"></div>
  <script>
    function runEmotionDetector() {
      $.get("/emotionDetector", {textToAnalyze: $("#textToAnalyze").val()},
        function (data) { $("#system_response").html(data); });
    }
  </script>
</body>
</html>
